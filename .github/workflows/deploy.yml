# This workflow tests the app, then builds it and deploys it to Cloudflare Workers
# (static assets), served at https://pizza.beroot.org — see wrangler.jsonc.
# Tests run on pull requests too; deployment only happens on push to master.

name: Test and deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Installs the Node version pinned in mise.toml (single source of truth).
    - uses: jdx/mise-action@v5

    - run: npm ci

    - run: npm run lint

    - run: npm test -- --watch=false

    - run: npx playwright install --with-deps chromium

    # playwright.config.ts starts its own dev server when CI is set (GitHub sets it).
    - run: npm run e2e

    # Traces of retried tests, to open with `npx playwright show-trace`.
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 7

  deploy:

    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: jdx/mise-action@v5

    - run: npm ci

    - run: npm run build:prod

    - uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
